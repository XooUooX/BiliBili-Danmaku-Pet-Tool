<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiliBili弹宠小助手</title>
    <script>
      // 渲染前根据保存的主题/系统偏好预设 dark 类，避免闪烁
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 如果入口模块因网络、缓存或发布切换未能执行，给出可操作提示而不是一直白屏。
      window.__APP_BOOT_TIMER__ = window.setTimeout(function () {
        if (window.__APP_STARTED__) return;
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#f8fafc;font-family:system-ui,-apple-system,sans-serif">' +
          '<section style="width:100%;max-width:460px;padding:32px;box-sizing:border-box;border:1px solid #e4e4e7;border-radius:18px;background:#fff;text-align:center;box-shadow:0 16px 45px rgba(15,23,42,.08)">' +
          '<h1 style="margin:0 0 10px;font-size:22px;color:#18181b">页面资源加载失败</h1>' +
          '<p style="margin:0 0 24px;color:#71717a;font-size:14px;line-height:1.7">网络可能暂时异常，或页面版本已经更新，请重新加载后再试。</p>' +
          '<button type="button" onclick="location.reload()" style="min-width:128px;padding:11px 18px;border:0;border-radius:10px;color:#fff;background:#2563eb;font-size:14px;font-weight:600;cursor:pointer">重新加载</button>' +
          '</section></main>';
      }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
